<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap&subset=vietnamese">
<title>Sách — Trạm AI Việt</title>
<style>
:root{
  --ground:#0A192F; --paper:#122A4D; --line:#2B4A7B; --ink:#E2E8F0; --soft:#A9BBD6;
  --acc:#00F5D4; --onacc:#06122E;
  --page:#F4ECD8; --pink:#3B3226; --hl:rgba(255,190,60,.38); --pline:rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.top-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--paper);flex:none}
.top-bar .t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;flex:none}
.ib:hover,.ib:focus-visible{border-color:var(--acc);outline:none}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
a.ib{color:inherit;text-decoration:none}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 12px}
.stage{position:relative;perspective:1800px;width:100%;max-width:560px;height:100%}
#book{margin:0 auto}
.pg{background:var(--page);color:var(--pink);padding:26px 26px 40px 30px;overflow:hidden;line-height:1.7;box-sizing:border-box;position:relative;border-radius:4px 10px 10px 4px;box-shadow:inset 12px 0 16px -12px rgba(0,0,0,.28)}
.stf__parent{margin:0 auto}
.pg h2{margin:0 0 .7em;font-size:1.25em;line-height:1.35}
.pg p{margin:0 0 .85em}
.pg .s{cursor:pointer;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pg .s.cur{background:var(--hl)}
.pnum{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13px;opacity:.6}
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;height:100%;gap:10px}
.cover .logo{width:64px;height:64px}
.cover h1{margin:6px 0 0;font-size:2em;line-height:1.2}
.cover .sub{opacity:.85}
.cover .by{font-size:.85em;opacity:.7}
.cover .note{font-size:.72em;opacity:.65;line-height:1.5;max-width:30em;margin-top:12px}
.cover .go{margin-top:14px;padding:10px 22px;border-radius:999px;border:0;background:#ff5f0a;color:#fff;font-weight:700;font-size:16px}
.bar{flex:none;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:10px;cursor:pointer}
.prog i{display:block;height:100%;width:0;background:var(--acc)}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px}
.ctrl .info{font-size:13px;color:var(--soft);min-width:78px;text-align:center}
.play{width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);display:grid;place-items:center}
.play svg{width:26px;height:26px;fill:currentColor;stroke:none}
.speed{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;font-size:14px;min-width:58px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.mask.on{display:flex}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:82vh;overflow:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.row label{flex:1;min-width:120px;font-size:15px}
.row .val{min-width:44px;text-align:right;color:var(--soft);font-size:14px}
.row input[type=range]{flex:2;min-width:140px;accent-color:#00F5D4}
.row select{flex:2;min-width:160px;background:var(--ground);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px}
.sw{display:flex;gap:10px}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tg{width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--ground);position:relative;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--soft);transition:.2s}
.tg.on{background:var(--acc)}
.tg.on::after{left:25px;background:var(--onacc)}
.mini{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 14px}
.warn{background:rgba(255,107,138,.12);border:1px solid #FF6B8A;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.toc button{display:block;width:100%;text-align:left;padding:12px 10px;border:0;border-bottom:1px solid var(--line);background:transparent}
.toc button:hover{background:rgba(255,255,255,.05)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.meas{position:absolute;visibility:hidden;left:-9999px;top:0;padding:26px 26px 40px 30px;line-height:1.7;overflow:hidden}
.meas h2{margin:0 0 .7em;font-size:1.25em;line-height:1.35}
.meas p{margin:0 0 .85em}
</style>
</head>
<body>
<div class="top-bar">
  <a class="ib" href="../" aria-label="Về kho quà"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
  <div class="t" id="ttl">Luật Hấp Dẫn</div>

</div>

<div class="wrap"><div class="stage" id="stage">

</div></div>

<div class="bar">
  <div class="prog" id="prog" aria-label="Tiến độ đọc"><i id="progI"></i></div>
  <div class="ctrl">
    <button class="ib" id="prev" aria-label="Trang trước"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="speed" id="spd" aria-label="Tốc độ đọc">1.0x</button>

  </div>
</div>

<div class="mask" id="mSet"><div class="sheet">
  <h3>Cài đặt đọc <button class="mini" data-close>Xong</button></h3>
  <div class="row"><label>Cỡ chữ</label><button class="mini" id="fsM">A−</button><span class="val" id="fsV">19</span><button class="mini" id="fsP">A+</button></div>
  <div class="row"><label>Màu trang</label><div class="sw" id="sw"></div></div>
  <div class="row"><label>Kiểu chữ có chân (giống sách in)</label><button class="tg" id="tgSerif" aria-label="Kiểu chữ"></button></div>
  <div class="row"><label>Tốc độ đọc</label><input type="range" id="rate" min="0.6" max="2.5" step="0.1"><span class="val" id="rateV">1.0x</span></div>
  <div class="row"><label>Giọng đọc</label><select id="engine"></select></div>
  <div id="aiNote" class="warn" style="border-color:var(--line);background:transparent">Giọng AI tải ở lần đầu (Nữ 1 khoảng 63MB, các giọng còn lại dùng chung gói 28MB), sau đó lưu trong máy, không cần tải lại.</div>
  <div class="row" id="voiceRow"><label>Giọng của máy</label><select id="voice"></select></div>
  <div id="voiceWarn"></div>
  <div class="row"><label>Tự lật trang khi đọc</label><button class="tg" id="tgAuto" aria-label="Tự lật trang"></button></div>
  <div class="row"><label>Hiệu ứng lật trang</label><button class="tg" id="tgAnim" aria-label="Hiệu ứng lật"></button></div>
  <div class="row"><button class="mini" id="restart">Đọc lại từ đầu</button></div>
</div></div>

<div class="mask" id="mToc"><div class="sheet"><h3>Mục lục <button class="mini" data-close>Đóng</button></h3><div class="toc" id="toc"></div></div></div>

<div class="toast" id="toast"></div>
<div class="meas" id="meas"></div>

<div id="logoSvg" hidden><svg class="logo" viewBox="79 92 1096 1096" role="img" aria-label="Logo Trạm AI Việt"><circle cx="627" cy="640" r="548" fill="#000"/><g transform="translate(0 150)" fill="#ff5f0a"><rect x="580" y="215" width="95" height="88" rx="18"/><path d="M380 325H880Q895 325 903 338L930 385Q940 410 915 410H700L920 735Q928 765 900 765H667V600H590V765H345Q318 765 328 735L555 410H335Q312 410 320 388L350 338Q358 325 380 325Z"/><path fill="#000" d="M627 510L697 560V588L660 596V765H592V596L555 588V560Z"/></g></svg></div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>var BOOK=(new URLSearchParams(location.search).get("b")||"luat-hap-dan").replace(/[^a-z0-9-]/g,"");document.write('<script src="'+BOOK+'.js"><\/script>');</script>
<script>
(function(){
  var B = window.SACH;
  if (!B) { document.body.innerHTML = "<p style='padding:24px'>Không tìm thấy sách này. <a href='../' style='color:#00F5D4'>Về kho quà</a></p>"; return; }
  var $ = function(id){ return document.getElementById(id); };
  var synth = window.speechSynthesis || null;

  /* ---------- ai đang đọc (để lưu theo khách) ---------- */
  function whoId(){
    try {
      var raw = localStorage.getItem("tav_khach_v1");
      if (!raw) { var m = document.cookie.match(/(?:^|; )tav_khach_v1=([^;]*)/); if (m) raw = decodeURIComponent(m[1]); }
      var j = JSON.parse(raw || "null");
      if (j && j.phone) return { id: String(j.phone).replace(/\D/g, ""), name: j.name || "" };
    } catch(e){}
    return { id: "may-nay", name: "" };
  }
  var ME = whoId();
  var POSKEY = "tav_sach_pos_" + B.id + "_" + ME.id;
  var CFGKEY = "tav_sach_cfg_v1";
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var cfg = { engine: "vi_VN-vais1000-medium:0", fs: 19, theme: "soft", serif: true, rate: 1, voice: "", auto: true, anim: true };
  try { var c0 = JSON.parse(lsGet(CFGKEY) || "null"); if (c0) for (var k in c0) cfg[k] = c0[k]; } catch(e){}
  function saveCfg(){ lsSet(CFGKEY, JSON.stringify(cfg)); }
  var savedPos = parseInt(lsGet(POSKEY) || "0", 10) || 0;
  function savePos(i){ savedPos = i; lsSet(POSKEY, String(i)); }

  /* ---------- màu ---------- */
  var THEMES = {
    soft:  { n:"Vàng dịu",  page:"#F4ECD8", ink:"#3B3226", hl:"rgba(255,190,60,.40)" },
    white: { n:"Trắng",     page:"#FFFFFF", ink:"#1F2937", hl:"rgba(255,200,0,.38)" },
    green: { n:"Xanh dịu",  page:"#E3EFE4", ink:"#23352B", hl:"rgba(255,200,60,.42)" },
    gray:  { n:"Xám",       page:"#DADDE2", ink:"#151A22", hl:"rgba(255,190,0,.40)" },
    night: { n:"Đêm",       page:"#10233F", ink:"#E2E8F0", hl:"rgba(0,245,212,.25)" }
  };
  function applyTheme(){
    var t = THEMES[cfg.theme] || THEMES.soft, r = document.documentElement.style;
    r.setProperty("--page", t.page); r.setProperty("--pink", t.ink); r.setProperty("--hl", t.hl);
    var f = cfg.serif ? '"Noto Serif","Times New Roman",serif' : 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
    [$("stage"), $("meas")].forEach(function(e){ e.style.fontFamily = f; e.style.fontSize = cfg.fs + "px"; });
    $("meas").style.width = $("stage").clientWidth + "px";
  }

  /* ---------- nội dung thành câu ---------- */
  var items = [], chapIdx = [];
  B.chapters.forEach(function(c, ci){
    chapIdx.push(items.length);
    items.push({ k:"h", t:c.t, ch:ci });
    c.p.forEach(function(p){
      p.split(/(?<=[.!?])\s+/).forEach(function(s, j){ if (s.trim()) items.push({ k:"s", t:s.trim(), ch:ci, np:j === 0 }); });
    });
  });

  /* ---------- chia trang ---------- */
  var pages = [], cur = 0, busy = false;
  var meas = $("meas");
  function esc(s){ return s.replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
  function paginate(){
    var st = $("stage");
    meas.style.width = st.clientWidth + "px"; meas.style.height = st.clientHeight + "px";
    meas.style.fontSize = cfg.fs + "px";
    pages = [{ cover:true, first:0, last:-1 }];
    var pg = null, curP = null;
    function newPage(){ meas.innerHTML = ""; curP = null; pg = { first:null, last:null }; pages.push(pg); }
    function add(it){
      var el, createdP = null;
      if (it.k === "h") { el = document.createElement("h2"); el.textContent = it.t; meas.appendChild(el); curP = null; return { el:el, p:null }; }
      if (!curP || it.np) { curP = document.createElement("p"); meas.appendChild(curP); createdP = curP; }
      el = document.createElement("span"); el.textContent = it.t + " "; curP.appendChild(el);
      return { el:el, p:createdP };
    }
    function over(){ return meas.scrollHeight > meas.clientHeight + 1; }
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!pg || it.k === "h") newPage();
      var r = add(it);
      if (over() && pg.first !== null) {
        if (r.p) meas.removeChild(r.p); else if (it.k === "h") meas.removeChild(r.el); else r.el.parentNode.removeChild(r.el);
        newPage(); add(it);
      }
      if (pg.first === null) pg.first = i;
      pg.last = i;
    }
  }
  function pageOf(i){
    for (var n = pages.length - 1; n > 0; n--) if (pages[n].first <= i) return n;
    return 0;
  }
  function html(n){
    var p = pages[n];
    if (p.cover) {
      var who = ME.name ? "<div class='by'>Bản đọc của " + esc(ME.name.split(" ").pop()) + "</div>" : "";
      return "<div class='cover'>" + $("logoSvg").innerHTML + "<h1>" + esc(B.title) + "</h1><div class='sub'>" + esc(B.sub) + "</div><div class='by'>" + esc(B.author) + "</div>" + who +
        "<button class='go' id='goBtn'>" + (savedPos > 0 ? "Đọc tiếp" : "Bắt đầu đọc") + "</button><div class='note'>" + esc(B.note) + "</div></div>";
    }
    var out = "", inP = false;
    for (var i = p.first; i <= p.last; i++) {
      var it = items[i];
      if (it.k === "h") { if (inP) { out += "</p>"; inP = false; } out += "<h2><span class='s' data-i='" + i + "'>" + esc(it.t) + "</span></h2>"; continue; }
      if (!inP || it.np) { if (inP) out += "</p>"; out += "<p>"; inP = true; }
      out += "<span class='s' data-i='" + i + "'>" + esc(it.t) + "</span> ";
    }
    if (inP) out += "</p>";
    return out + "<div class='pnum'>" + n + " / " + (pages.length - 1) + "</div>";
  }

  /* ---------- hiển thị + lật (thư viện page-flip: giấy cong như sách thật) ---------- */
  var readIdx = -1, pf = null, flipDone = null, fromCode = false, silent = false;
  function buildBook(){
    var st = $("stage");
    if (pf) { try { pf.destroy(); } catch(e){} pf = null; }
    st.innerHTML = "";
    var bk = document.createElement("div"); bk.id = "book"; st.appendChild(bk);
    for (var n = 0; n < pages.length; n++) { var d = document.createElement("div"); d.className = "pg"; d.innerHTML = html(n); bk.appendChild(d); }
    var W = st.clientWidth, H = st.clientHeight;
    if (!window.St || !St.PageFlip) { fallback = true; return; }
    pf = new St.PageFlip(bk, { width: W, height: H, size: "fixed", usePortrait: true, showCover: false, drawShadow: true,
      maxShadowOpacity: 0.45, flippingTime: 900, mobileScrollSupport: false, disableFlipByClick: true, clickEventForward: true,
      showPageCorners: true, startPage: 0, autoSize: false, swipeDistance: 20 });
    pf.loadFromHTML(bk.querySelectorAll(".pg"));
    if (cur > 0) { silent = true; try { pf.turnToPage(cur); } catch(e){} silent = false; }
    pf.on("flip", function(e){
      if (silent) return;
      var n = e.data, byCode = fromCode; fromCode = false;
      if (n === cur && !flipDone) return;
      cur = n; paint();
      if (flipDone) { var f = flipDone; flipDone = null; f(); return; }
      if (!byCode) { readIdx = -1; var was = playing; if (was) stopSpeech(true); if (pages[cur].first != null) savePos(cur === 0 ? 0 : pages[cur].first); if (was && cur > 0) speakFrom(pages[cur].first); else paint(); }
    });
    
  }
  var fallback = false;
  function paint(){
    if (fallback) { var st = $("stage"); st.innerHTML = "<div class='pg' style='height:100%'>" + html(cur) + "</div>"; }
    mark();
    $("info").textContent = cur === 0 ? "Bìa" : "Trang " + cur + "/" + (pages.length - 1);
    var lastI = pages[cur].last >= 0 ? pages[cur].last : 0;
    var ref = readIdx >= 0 ? readIdx : lastI;
    $("progI").style.width = Math.round((cur === 0 ? 0 : (ref + 1) / items.length) * 100) + "%";
  }
  function mark(){
    Array.prototype.forEach.call(document.querySelectorAll(".s.cur"), function(o){ o.classList.remove("cur"); });
    if (readIdx >= 0) Array.prototype.forEach.call(document.querySelectorAll(".s[data-i='" + readIdx + "']"), function(e){ e.classList.add("cur"); });
  }
  function show(n, done){
    if (n < 0 || n >= pages.length) { if (done) done(); return; }
    if (n === cur) { paint(); if (done) done(); return; }
    if (!pf) { cur = n; paint(); if (done) done(); return; }
    var busyNow = false; try { busyNow = pf.getState && pf.getState() !== "read"; } catch(e){}
    flipDone = done || null; fromCode = true;
    if (!cfg.anim || busyNow || Math.abs(n - cur) > 1) (function(){ silent = true; try { pf.turnToPage(n); } catch(e){} silent = false; var f = flipDone; flipDone = null; fromCode = false; cur = n; paint(); if (f) f(); })();
    else {
      /* thư viện page-flip 2.0.7 bỏ qua lật lùi khi tắt "lật bằng chạm", nên bật tạm lúc gọi */
      var stg = pf.getSettings(); stg.disableFlipByClick = false;
      try { if (n > cur) pf.flipNext("bottom"); else pf.flipPrev("top"); } finally { stg.disableFlipByClick = true; }
      /* đôi khi thư viện không chịu lật (ví dụ lần đầu sau khi mở lại đúng trang cũ) → chuyển trang thẳng */
      var want = n;
      setTimeout(function(){
        var st = "read"; try { st = pf.getState(); } catch(e){}
        if (st === "read" && cur !== want && flipDone) { var f = flipDone; flipDone = null; fromCode = false; silent = true; try { pf.turnToPage(want); } catch(e){} silent = false; cur = want; paint(); f(); }
      }, 250);
    }
  }
  function manualGo(n){
    if (n < 0 || n >= pages.length) return;
    readIdx = -1;
    var was = playing; if (was) stopSpeech(true);
    show(n, function(){ if (pages[cur].first != null) savePos(cur === 0 ? 0 : pages[cur].first); if (was && cur > 0) speakFrom(pages[cur].first); });
  }

  /* ---------- đọc thành tiếng ---------- */
  var playing = false, tk = 0, wd = null, voices = [];
  function loadVoices(){
    if (!synth) return;
    var all = synth.getVoices() || [];
    voices = all.filter(function(v){ return /^vi/i.test(v.lang); });
    var sel = $("voice"); sel.innerHTML = "";
    var mo = document.querySelector("#engine option[value='may']");
    if (mo) mo.hidden = mo.disabled = !voices.length;
    if (!voices.length && cfg.engine === "may") { cfg.engine = "vi_VN-vais1000-medium:0"; saveCfg(); setVoice(); $("engine").value = cfg.engine; showEngine(); }
    voices.forEach(function(v){ var o = document.createElement("option"); o.value = v.voiceURI; o.textContent = v.name; sel.appendChild(o); });
    if (voices.length) {
      var pick = voices.filter(function(v){ return v.voiceURI === cfg.voice; })[0] ||
        voices.filter(function(v){ return /natural|online/i.test(v.name); })[0] || voices[0];
      sel.value = pick.voiceURI; cfg.voice = pick.voiceURI;
    }
    $("voiceWarn").innerHTML = voices.length ? "" : "<div class='warn'>Máy chưa có giọng tiếng Việt. Điện thoại thường có sẵn. Trên máy tính, dùng Microsoft Edge hoặc Chrome, hoặc thêm giọng Tiếng Việt trong Cài đặt Windows &gt; Giờ &amp; ngôn ngữ &gt; Giọng nói.</div>";
  }
  /* ---------- giọng AI (Piper, mã nguồn mở, chạy ngay trong máy) ---------- */
  var PIPER = "./piper-vi.js";
  var VOICES = [["Nữ 1 — rõ nhất", "vi_VN-vais1000-medium", 0]];
  [18, 27, 17, 31, 13, 24, 62].forEach(function(sp, k){ VOICES.push(["Nữ " + (k + 2), "vi_VN-vivos-x_low", sp]); });
  [45, 54, 41, 50, 33, 47, 30].forEach(function(sp, k){ VOICES.push(["Nam " + (k + 1), "vi_VN-vivos-x_low", sp]); });
  VOICES.push(["Nam 8 — trầm", "vi_VN-vivos-x_low", 57]);
  if (!/^vi_VN-[a-z0-9_-]+:\d+$|^may$/.test(cfg.engine)) cfg.engine = "vi_VN-vais1000-medium:0";
  var VID = "", SPK = 0;
  function setVoice(){ if (cfg.engine === "may") return; var p = cfg.engine.split(":"); if (p[0] !== VID || +p[1] !== SPK) { aiClear(); if (p[0] !== VID) { aiReady = false; aiLoading = null; } VID = p[0]; SPK = +p[1]; } }
  var piper = null, aiReady = false, aiLoading = null, aiCache = {}, aiQ = Promise.resolve();
  function aiClear(){ Object.keys(aiCache).forEach(function(k){ aiCache[k].then(function(u){ URL.revokeObjectURL(u); }, function(){}); }); aiCache = {}; }
  var aud = new Audio(); aud.preload = "auto";
  var SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
  function loadAI(){
    if (aiLoading) return aiLoading;
    aiLoading = import(PIPER).then(function(m){
      piper = m;
      var canSave = !!(navigator.storage && navigator.storage.getDirectory);
      if (!canSave) return m.predict({ text: "a", voiceId: VID, speakerId: SPK });
      return m.stored().catch(function(){ return null; }).then(function(s){
        if (s === null) return m.predict({ text: "a", voiceId: VID, speakerId: SPK });
        if (s.indexOf(VID) >= 0) return;
        return m.download(VID, function(p){ if (p && p.total) $("info").textContent = "Tải giọng " + Math.round(p.loaded / p.total * 100) + "%"; });
      });
    }).then(function(){ aiReady = true; });
    aiLoading.catch(function(){ aiLoading = null; });
    return aiLoading;
  }
  function clean(t){ return t.replace(/\.{2,}/g, ",").replace(/\s*[—–]\s*/g, ", "); }
  function aiGet(i){
    if (i >= items.length) return null;
    if (!aiCache[i]) {
      var p = aiQ.then(function(){ return piper.predict({ text: clean(items[i].t), voiceId: VID, speakerId: SPK }); }).then(function(b){ return URL.createObjectURL(b); });
      aiQ = p.catch(function(){});
      aiCache[i] = p;
    }
    return aiCache[i];
  }
  function aiTrim(i){
    Object.keys(aiCache).forEach(function(k){ k = +k; if (k < i - 1 || k > i + 6) { aiCache[k].then(function(u){ URL.revokeObjectURL(u); }, function(){}); delete aiCache[k]; } });
  }
  function useAI(){ return cfg.engine !== "may"; }

  function speakFrom(i){
    if (useAI()) {
      try { aud.src = SILENT; aud.play().catch(function(){}); } catch(e){}
      tk++; var my = tk; playing = true; setPlayIcon();
      if (aiReady) { readItem(i, my); return; }
      $("info").textContent = "Đang tải giọng…";
      loadAI().then(function(){ if (my === tk && playing) readItem(i, my); }, function(err){
        try { console.error(err); } catch(e){}
        var why = String(err && err.message || err || "").slice(0, 90);
        playing = false; setPlayIcon(); paint2();
        toast("Chưa tải được giọng AI (" + why + "). Kiểm tra mạng rồi bấm phát lại. Nếu đang mở trong Zalo/Facebook, hãy mở bằng Chrome.");
      });
      return;
    }
    if (!synth || !voices.length) { cfg.engine = "vi_VN-vais1000-medium:0"; saveCfg(); setVoice(); $("engine").value = cfg.engine; showEngine(); toast("Máy không có giọng tiếng Việt, dùng giọng AI tiếng Việt"); speakFrom(i); return; }
    synth.cancel(); tk++; playing = true; setPlayIcon(); readItem(i, tk);
  }
  function readItem(i, my){
    if (my !== tk || !playing) return;
    if (i >= items.length) { playing = false; setPlayIcon(); readIdx = -1; mark(); toast("Đã đọc hết cuốn sách"); savePos(0); return; }
    var n = pageOf(i);
    if (n !== cur) {
      if (!cfg.auto) { playing = false; setPlayIcon(); savePos(i); toast("Hết trang. Bật lật trang hoặc bấm lật để đọc tiếp"); return; }
      show(n, function(){ if (my === tk) readItem(i, my); });
      return;
    }
    readIdx = i; mark(); savePos(i);
    $("progI").style.width = Math.round((i + 1) / items.length * 100) + "%";
    if (useAI()) {
      aiTrim(i);
      var done = false, nx = function(){ if (done) return; done = true; if (my === tk && playing) readItem(i + 1, my); };
      aiGet(i).then(function(url){
        if (my !== tk || !playing) return;
        aud.onended = nx; aud.onerror = nx;
        aud.src = url; aud.playbackRate = cfg.rate;
        var pr = aud.play(); if (pr && pr.catch) pr.catch(function(){ playing = false; setPlayIcon(); toast("Bấm nút phát để đọc tiếp"); });
        aiGet(i + 1); aiGet(i + 2); aiGet(i + 3);
      }, nx);
      paint2();
      return;
    }
    var u = new SpeechSynthesisUtterance(clean(items[i].t));
    u.lang = "vi-VN"; u.rate = cfg.rate;
    var v = voices.filter(function(x){ return x.voiceURI === cfg.voice; })[0] || voices[0]; u.voice = v; u.lang = v.lang;
    var next = function(){ clearTimeout(wd); if (my === tk && playing) readItem(i + 1, my); };
    u.onend = next;
    u.onerror = function(e){ if (e && (e.error === "canceled" || e.error === "interrupted")) return; next(); };
    clearTimeout(wd);
    wd = setTimeout(function(){ if (my === tk && playing) { try { synth.cancel(); } catch(e){} next(); } }, items[i].t.length * 130 / cfg.rate + 7000);
    synth.speak(u);
  }
  function stopSpeech(keepUi){
    tk++; playing = false; clearTimeout(wd);
    try { if (synth) synth.cancel(); } catch(e){}
    try { aud.pause(); aud.onended = null; aud.onerror = null; } catch(e){}
    if (!keepUi) setPlayIcon();
  }
  function setPlayIcon(){
    $("playIc").innerHTML = playing ? "<path d='M6 4h4v16H6zM14 4h4v16h-4z'/>" : "<path d='M7 4.5v15l13-7.5z'/>";
    $("play").setAttribute("aria-label", playing ? "Tạm dừng" : "Đọc");
  }
  function startFromSaved(){
    var i = savedPos > 0 && savedPos < items.length ? savedPos : (chapIdx[0] || 0);
    var n = pageOf(i);
    var go = function(){ speakFrom(i); };
    if (n !== cur) show(n, go); else go();
    if (savedPos > 0) toast("Mở lại đúng chỗ bạn đang đọc");
  }
  function togglePlay(){
    if (playing) { stopSpeech(); return; }
    if (cur === 0) { startFromSaved(); return; }
    var i = readIdx >= 0 ? readIdx : pages[cur].first;
    speakFrom(i);
  }

  function paint2(){ $("info").textContent = cur === 0 ? "Bìa" : "Trang " + cur + "/" + (pages.length - 1); }
  function showEngine(){ var ai = useAI(); $("voiceRow").style.display = ai ? "none" : ""; $("voiceWarn").style.display = ai ? "none" : ""; $("aiNote").style.display = ai ? "" : "none"; }

  /* ---------- giao diện ---------- */
  var tt = null;
  function toast(m){ var t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove("on"); }, Math.max(2600, m.length * 70)); }
  function openM(id){ $(id).classList.add("on"); }
  function closeAll(){ Array.prototype.forEach.call(document.querySelectorAll(".mask"), function(m){ m.classList.remove("on"); }); }
  function tg(id, key){
    var b = $(id); b.classList.toggle("on", !!cfg[key]);
    b.onclick = function(){ cfg[key] = !cfg[key]; b.classList.toggle("on", !!cfg[key]); saveCfg(); if (key === "serif") relayout(); };
  }
  function spdLabel(){ var t = cfg.rate.toFixed(1) + "x"; $("spd").textContent = t; $("rateV").textContent = t; $("rate").value = cfg.rate; }
  function relayout(keepPlay){
    var anchor = readIdx >= 0 ? readIdx : (cur > 0 ? pages[cur].first : savedPos);
    applyTheme(); paginate();
    cur = anchor > 0 ? pageOf(anchor) : 0;
    buildBook(); paint();
  }
  function buildSw(){
    var sw = $("sw"); sw.innerHTML = "";
    Object.keys(THEMES).forEach(function(k){
      var b = document.createElement("button"); b.style.background = THEMES[k].page; b.title = THEMES[k].n; b.setAttribute("aria-label", THEMES[k].n);
      if (k === cfg.theme) b.classList.add("on");
      b.onclick = function(){ cfg.theme = k; saveCfg(); applyTheme(); buildSw(); paint(); };
      sw.appendChild(b);
    });
  }
  function buildToc(){
    var t = $("toc"); t.innerHTML = "";
    B.chapters.forEach(function(c, ci){
      var b = document.createElement("button"); b.textContent = c.t;
      b.onclick = function(){ closeAll(); var i = chapIdx[ci]; var was = playing; stopSpeech(true); readIdx = -1; show(pageOf(i), function(){ savePos(i); if (was) speakFrom(i); }); };
      t.appendChild(b);
    });
  }

  /* chạm nhẹ vào một câu (không kéo) = đọc từ câu đó; thư viện lật trang nuốt sự kiện click nên bắt ở pointerdown/up */
  var pd = null;
  window.addEventListener("pointerdown", function(e){ pd = { x: e.clientX, y: e.clientY, t: Date.now() }; }, true);
  window.addEventListener("pointerup", function(e){
    if (!pd) return; var d = pd; pd = null;
    if (Math.abs(e.clientX - d.x) > 6 || Math.abs(e.clientY - d.y) > 6 || Date.now() - d.t > 600) return;
    var els = document.elementsFromPoint ? document.elementsFromPoint(e.clientX, e.clientY) : [e.target];
    for (var k = 0; k < els.length; k++) {
      if (els[k].id === "goBtn") { startFromSaved(); return; }
      var s = els[k].closest && els[k].closest(".s");
      if (s && s.dataset.i != null && $("stage").contains(s)) { speakFrom(parseInt(s.dataset.i, 10)); return; }
      if (els[k].classList && els[k].classList.contains("mask")) break;
    }
  }, true);
  document.addEventListener("click", function(e){
    if (e.target.hasAttribute && e.target.hasAttribute("data-close")) closeAll();
    if (e.target.classList && e.target.classList.contains("mask")) closeAll();
  });
  $("play").onclick = togglePlay;
  $("next").onclick = function(){ manualGo(cur + 1); };
  $("prev").onclick = function(){ manualGo(cur - 1); };
  $("tocBtn").onclick = function(){ openM("mToc"); };
  $("setBtn").onclick = function(){ openM("mSet"); };
  $("spd").onclick = function(){ cfg.rate = cfg.rate >= 2.5 ? 0.8 : Math.min(2.5, Math.round((cfg.rate + 0.2) * 10) / 10); saveCfg(); spdLabel(); if (useAI()) { try { aud.playbackRate = cfg.rate; } catch(e){} } else if (playing) speakFrom(readIdx >= 0 ? readIdx : pages[cur].first); };
  $("rate").oninput = function(){ cfg.rate = parseFloat(this.value); saveCfg(); spdLabel(); try { aud.playbackRate = cfg.rate; } catch(e){} };
  $("engine").onchange = function(){ var was = playing, at = readIdx >= 0 ? readIdx : pages[cur].first; stopSpeech(); cfg.engine = this.value; saveCfg(); setVoice(); showEngine(); if (useAI()) loadAI().catch(function(){}); if (was) speakFrom(at); };
  $("rate").onchange = function(){ if (playing && !useAI()) speakFrom(readIdx >= 0 ? readIdx : pages[cur].first); };
  $("voice").onchange = function(){ cfg.voice = this.value; saveCfg(); if (playing) speakFrom(readIdx >= 0 ? readIdx : pages[cur].first); };
  $("fsM").onclick = function(){ cfg.fs = Math.max(14, cfg.fs - 1); $("fsV").textContent = cfg.fs; saveCfg(); relayout(); };
  $("fsP").onclick = function(){ cfg.fs = Math.min(32, cfg.fs + 1); $("fsV").textContent = cfg.fs; saveCfg(); relayout(); };
  $("restart").onclick = function(){ closeAll(); stopSpeech(); savePos(0); readIdx = -1; show(0); toast("Đã về đầu sách"); };
  $("prog").onclick = function(e){
    var r = this.getBoundingClientRect(), f = (e.clientX - r.left) / r.width, i = Math.max(0, Math.min(items.length - 1, Math.floor(f * items.length)));
    var was = playing; stopSpeech(true); readIdx = -1; show(pageOf(i), function(){ savePos(i); if (was) speakFrom(i); });
  };
  document.addEventListener("keydown", function(e){
    if (/INPUT|SELECT|TEXTAREA/.test((e.target.tagName || ""))) return;
    if (e.key === "ArrowRight") manualGo(cur + 1);
    else if (e.key === "ArrowLeft") manualGo(cur - 1);
    else if (e.key === " ") { e.preventDefault(); togglePlay(); }
    else if (e.key === "Escape") closeAll();
  });
  var rz = null;
  window.addEventListener("resize", function(){ clearTimeout(rz); rz = setTimeout(function(){ relayout(); }, 250); });
  window.addEventListener("pagehide", function(){ try { if (synth) synth.cancel(); } catch(e){} });

  /* ---------- khởi động ---------- */
  $("ttl").textContent = B.title + " — " + B.sub; document.title = B.title + " — Trạm AI Việt";
  $("fsV").textContent = cfg.fs; (function(){ var sel = $("engine"), gs = { "Giọng nữ": [], "Giọng nam": [] };
    VOICES.forEach(function(v){ (/^Nữ/.test(v[0]) ? gs["Giọng nữ"] : gs["Giọng nam"]).push(v); });
    Object.keys(gs).forEach(function(g){ var og = document.createElement("optgroup"); og.label = g; gs[g].forEach(function(v){ var o = document.createElement("option"); o.value = v[1] + ":" + v[2]; o.textContent = v[0]; og.appendChild(o); }); sel.appendChild(og); });
    var o = document.createElement("option"); o.value = "may"; o.textContent = "Giọng có sẵn của máy"; sel.appendChild(o);
  })();
  setVoice(); $("engine").value = cfg.engine; showEngine();
  if (useAI()) import(PIPER).then(function(m){ piper = m; return m.stored(); }).then(function(s){ if (s && s.indexOf(VID) >= 0) { aiLoading = Promise.resolve(); aiReady = true; } }).catch(function(){});
  tg("tgSerif", "serif"); tg("tgAuto", "auto"); tg("tgAnim", "anim");
  buildSw(); buildToc(); spdLabel();
  applyTheme(); paginate();
  cur = savedPos > 0 ? pageOf(savedPos) : 0;
  buildBook(); paint();
  if (savedPos > 0) toast("Bạn đang đọc dở, bấm phát để đọc tiếp");
  if (synth) { loadVoices(); if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices; }
  else { var mo0 = document.querySelector("#engine option[value='may']"); if (mo0) mo0.hidden = mo0.disabled = true; if (cfg.engine === "may") { cfg.engine = "vi_VN-vais1000-medium:0"; setVoice(); $("engine").value = cfg.engine; showEngine(); } }
})();
</script>
</body>
</html>
